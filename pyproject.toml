[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "linux-face-unlock"
version = "1.0.0"
description = "Universal, High-Security Face Unlock Biometrics for Linux"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "numpy>=1.20",
    "opencv-python-headless>=4.8",
]

[project.scripts]
faceunlock = "faceunlock.cli:main"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
