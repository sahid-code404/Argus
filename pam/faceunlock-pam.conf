# Linux Face Unlock - PAM Configuration Guide
#
# Linux authentication uses PAM (Pluggable Authentication Modules).
# Placing "auth sufficient pam_exec.so" at the beginning of the auth stack allows
# Face Unlock to authenticate you instantly. If face unlock fails, times out, or
# camera is unavailable, PAM seamlessly falls through to fingerprint or password!
#
# ------------------------------------------------------------------------------
# 1. Sudo Authentication (/etc/pam.d/sudo)
# ------------------------------------------------------------------------------
# Add as the first auth rule in /etc/pam.d/sudo:
#
# auth    sufficient    pam_exec.so stdout /opt/faceunlock/pam/pam_faceunlock.py
# auth    include       system-auth
#
# ------------------------------------------------------------------------------
# 2. Desktop Lock Screen (/etc/pam.d/gnome-screensaver, swaylock, hyprlock)
# ------------------------------------------------------------------------------
# Add as the first auth rule in your screen locker PAM file:
#
# auth    sufficient    pam_exec.so stdout /opt/faceunlock/pam/pam_faceunlock.py
# auth    include       password-auth
#
# ------------------------------------------------------------------------------
# 3. Polkit GUI Administration Dialogs (/etc/pam.d/polkit-1)
# ------------------------------------------------------------------------------
# Add as the first auth rule in /etc/pam.d/polkit-1:
#
# auth    sufficient    pam_exec.so stdout /opt/faceunlock/pam/pam_faceunlock.py
#
# ------------------------------------------------------------------------------
# Note: Cold-boot login managers (GDM, SDDM) are intentionally password-backed
# to ensure native GNOME Keyring / Secret Service decryption without issues.
# ------------------------------------------------------------------------------
