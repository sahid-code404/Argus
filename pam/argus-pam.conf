# Argus - PAM Configuration Guide
#
# Linux authentication uses PAM (Pluggable Authentication Modules).
# Placing "auth sufficient pam_exec.so" at the beginning of the auth stack allows
# Argus to authenticate you instantly. If biometric auth fails, times out, or
# camera is unavailable, PAM seamlessly falls through to fingerprint or password!
#
# ------------------------------------------------------------------------------
# 1. Sudo Authentication (/etc/pam.d/sudo)
# ------------------------------------------------------------------------------
# Add as the first auth rule in /etc/pam.d/sudo:
#
# auth    sufficient    pam_exec.so stdout /opt/argus/pam/pam_argus.py
# auth    include       system-auth
#
# ------------------------------------------------------------------------------
# 2. GNOME Display Manager (/etc/pam.d/gdm-password)
# ------------------------------------------------------------------------------
# Add before pam_unix.so:
#
# auth    sufficient    pam_exec.so stdout /opt/argus/pam/pam_argus.py
#
# ------------------------------------------------------------------------------
# 3. SDDM / LightDM / Swaylock / Hyprlock
# ------------------------------------------------------------------------------
# For screen lockers (/etc/pam.d/swaylock, /etc/pam.d/hyprlock, /etc/pam.d/sddm):
#
# auth    sufficient    pam_exec.so stdout /opt/argus/pam/pam_argus.py
#
# ------------------------------------------------------------------------------
# 4. Central System Auth (Fedora / RHEL / Arch)
# ------------------------------------------------------------------------------
# In /etc/pam.d/system-auth:
#
# auth    sufficient    pam_exec.so stdout /opt/argus/pam/pam_argus.py
# auth    sufficient    pam_fprintd.so
# auth    sufficient    pam_unix.so try_first_pass nullok
