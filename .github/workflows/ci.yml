name: Argus CI & Verification

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libpam0g-dev build-essential gcc

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy opencv-python-headless pytest cryptography

      - name: Build Native SIMD acceleration library
        run: |
          gcc -O3 -shared -fPIC -mavx2 -mfma -o argus/libargus_simd.so src/fast_simd.c || \
          gcc -O3 -shared -fPIC -o argus/libargus_simd.so src/fast_simd.c
          cp argus/libargus_simd.so faceunlock/libargus_simd.so
          cp argus/libargus_simd.so faceunlock/libfaceunlock_simd.so

      - name: Run Deterministic Pytest Suite
        run: |
          PYTHONPATH=. pytest tests/ -v -k "not test_real_system_hardware_probe"
